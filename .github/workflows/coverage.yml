name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov coverage[toml]
          python -m pip install -r test/requirements.txt
          python -m pip install -e .

      - name: Run tests with coverage
        run: |
          python -m pytest test/ \
            --cov=json_database \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=html \
            -v

      - name: Enforce coverage threshold
        run: |
          python - <<'PY'
          import json
          total = float(json.load(open("coverage.json"))["totals"]["percent_covered"])
          minimum = 80.0
          if total < minimum:
              raise SystemExit(f"Coverage {total:.2f}% is below {minimum:.2f}%")
          print(f"Coverage {total:.2f}% meets {minimum:.2f}%")
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn
